<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Dashboard | UNRE LMS Portal</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons 1.13 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <!-- Custom Demo CSS -->
    <link rel="stylesheet" href="assets/css/demo.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
</head>
<body class="sb-nav-fixed" id="bodyBg">

    <!-- Top Navigation -->
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
        <a class="navbar-brand ps-3" href="dashboard.html">
            <i class="bi-shield-check text-success"></i> UNRE | LMS
        </a>
        <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="bi-list menu-btn"></i></button>
        
        <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi-person-circle"></i>&nbsp;Hi, <span id="topbarUserName">User</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                    <li><a class="dropdown-item" href="#"><i class="bi-person-circle"></i>&nbsp;User Credentials</a></li>
                    <li><a class="dropdown-item" href="#"><i class="bi-key"></i>&nbsp;Change Password</a></li>
                    <li><hr class="dropdown-divider" /></li>
                    <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi-arrow-right-circle"></i>&nbsp;Sign Out</a></li>
                </ul>
            </li>
        </ul>
    </nav>

    <!-- Main Layout -->
    <div id="layoutSidenav">
        <!-- Sidebar Navigation (Populated by JS) -->
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-light" id="sidenavAccordion">
                <div class="sb-sidenav-menu">
                    <div class="nav" id="dynamicSidebar">
                        <!-- JS will inject links here based on role -->
                    </div>
                </div>
                <div class="sb-sidenav-footer">
                    <div class="small">Logged in as:</div>
                    <i class="bi-person"></i>&nbsp;<span id="sidebarUserName">User</span>
                </div>
            </nav>
        </div>

        <!-- Page Content -->
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="display-3">Dashboard</h1>
                    </div>

                    <!-- Admin Dashboard Placeholder -->
                    <div class="col-sm-12">
                        <div class="card">
                            <div class="card-body text-center">
                                <h3 class="display-4">
                                    <i class="bi-people"></i><br>
                                    All Users
                                </h3>
                                <p class="text-muted">Placeholder for Admin/Executive Dashboard Content</p>
                            </div>
                        </div>
                    </div>

                </div>
            </main>
            
            <footer class="py-4 bg-light mt-auto">
                <div class="container-fluid px-4">
                    <div class="d-flex align-items-center justify-content-between small">
                        <div class="text-muted">Copyright &copy; PNG UNRE Loans Management System (Demo) 2024</div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <!-- Scroll to Top Button -->
    <button onclick="topFunction()" id="scroll-btn" class="btn btn-dark">
        <i class="bi-arrow-up-circle"></i>
    </button>

    <!-- Bootstrap Bundle (Includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Demo JS -->
    <script src="assets/js/demo.js"></script>
</body>
</html>
