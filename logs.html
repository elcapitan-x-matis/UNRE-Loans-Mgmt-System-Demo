<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>User Logs Registry | UNRE LMS Portal</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link href="https://cdn.datatables.net/2.0.2/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/3.0.1/css/buttons.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/demo.css">
</head>
<body class="sb-nav-fixed" id="bodyBg">

    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
        <a class="navbar-brand ps-3" href="dashboard.html"><i class="bi-shield-check text-success"></i> UNRE | LMS</a>
        <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="bi-list menu-btn"></i></button>
        <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi-person-circle"></i>&nbsp;Hi, <span id="topbarUserName">User</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#"><i class="bi-person-circle"></i>&nbsp;User Credentials</a></li>
                    <li><a class="dropdown-item" href="#"><i class="bi-key"></i>&nbsp;Change Password</a></li>
                    <li><hr class="dropdown-divider" /></li>
                    <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi-arrow-right-circle"></i>&nbsp;Sign Out</a></li>
                </ul>
            </li>
        </ul>
    </nav>

    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-light" id="sidenavAccordion">
                <div class="sb-sidenav-menu"><div class="nav" id="dynamicSidebar"></div></div>
                <div class="sb-sidenav-footer">
                    <div class="small">Logged in as:</div>
                    <i class="bi-person"></i>&nbsp;<span id="sidebarUserName">User</span>
                </div>
            </nav>
        </div>

        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1>User Logs Registry</h1>
                    </div>

                    <div class="row">
                        <div class="col-sm-12">
                            <div class="table-responsive">
                                <table class="table table-md table-striped" id="logsTable" width="100%" cellspacing="0">
                                    <thead class="bg-dark text-center">
                                        <tr><th>Log ID</th><th>Username</th><th>Attempt</th><th>Last Log In</th><th>Last Log Out</th><th>IP</th></tr>
                                    </thead>
                                    <tfoot class="bg-dark text-center">
                                        <tr><th>Log ID</th><th>Username</th><th>Attempt</th><th>Last Log In</th><th>Last Log Out</th><th>IP</th></tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            </main>
            <footer class="py-4 bg-light mt-auto">
                <div class="container-fluid px-4">
                    <div class="d-flex align-items-center justify-content-between small">
                        <div class="text-muted">Copyright &copy; PNG UNRE Loans Management System (Demo) 2024</div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/2.0.2/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.0.2/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.0.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.0.1/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.0.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.0.1/js/buttons.print.min.js"></script>

    <script src="assets/js/demo.js"></script>
    <script src="assets/js/data-engine.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loaded = await loadDatabase();
            if (!loaded) return;
            const registryData = getLogsRegistryData();
            $('#logsTable').DataTable({
                data: registryData,
                columns: [
                    { data: 'logID', className: 'text-center', render: function(data) { return `<a href="#">${data}&nbsp;<i class="bi-arrow-right-circle"></i></a>`; }},
                    { data: 'log_username', className: 'text-center' },
                    { data: 'attemptBadge', className: 'text-center' },
                    { data: 'formattedLogin', className: 'text-center' },
                    { data: 'formattedLogout', className: 'text-center' },
                    { data: 'ip_address', className: 'text-center' }
                ],
                dom: 'Bfrtip',
                buttons: [
                    { extend: 'copy', className: 'btn btn-sm btn-outline-secondary' },
                    { extend: 'csv', className: 'btn btn-sm btn-outline-secondary' },
                    { extend: 'excel', className: 'btn btn-sm btn-outline-secondary' },
                    { extend: 'pdf', className: 'btn btn-sm btn-outline-secondary' },
                    { extend: 'print', className: 'btn btn-sm btn-outline-secondary' }
                ],
                pageLength: 10
            });
        });
    </script>
</body>
</html>
